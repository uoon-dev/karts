<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-ARTS 캠퍼스</title>
<style>
:root{--ink:#1d2433;--paper:rgba(255,252,244,.82);--line:rgba(29,36,51,.14);--accent:#e0a526;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2efe6;--paper:rgba(24,28,40,.82);--line:rgba(242,239,230,.16)}}
:root[data-theme="dark"]{--ink:#f2efe6;--paper:rgba(24,28,40,.82);--line:rgba(242,239,230,.16)}
html,body{height:100%;margin:0;overflow:hidden;background:#dfe7ee;font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink)}
canvas{display:block}
.tag{position:fixed;left:0;top:0;transform:translate(-50%,-100%);padding:3px 10px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:12px;white-space:nowrap;pointer-events:none;backdrop-filter:blur(6px)}
.tag.big{font-size:14px;font-weight:700;padding:5px 14px}
.tag.sorry{font-size:14px;font-weight:700;padding:7px 16px;border-radius:16px;overflow:visible}
.tag.sorry::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:inherit;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
#hint,#zone{position:fixed;left:50%;transform:translateX(-50%);font-size:13px;padding:6px 14px;border-radius:99px;background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(6px)}
#hint{top:calc(14px + env(safe-area-inset-top,0px))}
#zone{top:calc(54px + env(safe-area-inset-top,0px));opacity:0;transition:opacity .3s;font-weight:700}
#bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:20px;background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(8px)}
#bar button{all:unset;cursor:pointer;display:grid;gap:2px;justify-items:center;width:64px;padding:8px 0;border-radius:14px;font-size:12px}
#bar button span{font-size:20px;line-height:1}
#bar button:hover{background:var(--line)}
#bar button:focus-visible{outline:2px solid var(--accent)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#cast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(92vw,460px);padding:8px 10px;border-radius:16px;background:var(--paper);border:1px solid var(--line);backdrop-filter:blur(8px);box-sizing:border-box}
#row{display:flex;gap:8px;align-items:center}
#sel{font-size:12px;white-space:nowrap}
#spell{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
#spell:focus-visible,#go:focus-visible{outline:2px solid var(--accent)}
#go{font:inherit;font-size:14px;cursor:pointer;color:var(--ink);background:var(--line);border:0;border-radius:10px;padding:8px 12px}
#hints{margin-top:6px;font-size:11px;opacity:.8;line-height:1.4}
</style>
</head>
<body>
<div id="hint">WASD·방향키로 이동 · 스페이스 점프 · 1~4 동작 · 캐릭터 클릭 후 Enter로 주문</div>
<div id="zone"></div>
<div id="bar" role="toolbar" aria-label="동작">
  <button data-a="play"><span>♪</span>연주</button>
  <button data-a="act"><span>🎭</span>연기</button>
  <button data-a="dance"><span>✦</span>춤</button>
  <button data-a="shoot"><span>◉</span>촬영</button>
</div>
<div id="cast"><div id="row"><span id="sel">대상: 없음</span><input id="spell" type="text" placeholder="주문 입력 (Enter 키)" autocomplete="off" aria-label="주문"><button id="go">시전</button></div><div id="hints"></div></div>
<div id="flash"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=s=>document.querySelector(s);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xdfe7ee);
scene.fog=new THREE.Fog(0xdfe7ee,30,75);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);
cam.position.set(0,6,11);
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=true;
document.body.appendChild(R.domElement);
const oc=new THREE.OrbitControls(cam,R.domElement);
oc.enableDamping=true;oc.enablePan=false;oc.minDistance=5;oc.maxDistance=26;oc.maxPolarAngle=1.4;
scene.add(new THREE.HemisphereLight(0xfff4de,0xb9c4cf,.9));
const sun=new THREE.DirectionalLight(0xffffff,.8);
sun.position.set(12,20,8);sun.castShadow=true;
sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;
sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const M=(c,o={})=>new THREE.MeshToonMaterial(Object.assign({color:c},o));

// ground
const ground=new THREE.Mesh(new THREE.CircleGeometry(34,64),M(0x2f6fd6));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const plaza=new THREE.Mesh(new THREE.CircleGeometry(6,48),M(0xffffff));
plaza.rotation.x=-Math.PI/2;plaza.position.y=.01;scene.add(plaza);

// buildings: 한국예술종합학교의 여섯 개 원
const defs=[
 ['음악원',0xf4efe4,3.2,4.2,3.2],['연극원',0xc9514a,3.6,3,2.8],['영상원',0x2c3548,3.4,3.6,3.4],
 ['무용원',0xf0b8a6,3.6,2.6,3],['미술원',0xe6c35c,3,3.4,3],['전통예술원',0x8b6a4a,3.8,2.4,3.2]];
const tags=[],solids=[];
defs.forEach((d,i)=>{
  const a=i/defs.length*Math.PI*2+.3,r=15;
  const x=Math.cos(a)*r,z=Math.sin(a)*r;
  const b=new THREE.Mesh(new THREE.BoxGeometry(d[2],d[3],d[4]),M(d[1]));
  b.position.set(x,d[3]/2,z);b.rotation.y=-a+Math.PI/2;b.castShadow=b.receiveShadow=true;scene.add(b);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(d[2]+.4,.25,d[4]+.4),M(0x1d2433));
  roof.position.set(x,d[3]+.12,z);roof.rotation.y=b.rotation.y;roof.castShadow=true;scene.add(roof);
  const p=new THREE.Mesh(new THREE.PlaneGeometry(1.2,d[3]*.55),M(0xfffbe8,{emissive:0xffe9a8,emissiveIntensity:.35}));
  p.position.set(0,-d[3]*.12,d[4]/2+.01);b.add(p);
  solids.push({x,z,r:Math.max(d[2],d[4])/2+.7,name:d[0]});
  tags.push(tag(d[0],new THREE.Vector3(x,d[3]+.9,z),'big'));
});
// ginkgo & maple trees
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
const rand=rnd(7);
for(let i=0;i<34;i++){
  const a=rand()*Math.PI*2,r=8+rand()*24,x=Math.cos(a)*r,z=Math.sin(a)*r;
  if(solids.some(s=>Math.hypot(s.x-x,s.z-z)<s.r+2))continue;
  const g=new THREE.Group(),h=1.2+rand()*.8;
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,h,6),M(0x5a4636));t.position.y=h/2;t.castShadow=true;g.add(t);
  const col=[0xf2c230,0xe8a317,0xd2552f,0xf6d56a][Math.floor(rand()*4)];
  const c=new THREE.Mesh(new THREE.IcosahedronGeometry(.9+rand()*.5,1),M(col));c.position.y=h+.8;c.castShadow=true;g.add(c);
  g.position.set(x,0,z);scene.add(g);solids.push({x,z,r:.5});
}
// hanging lanterns around plaza
for(let i=0;i<10;i++){
  const a=i/10*Math.PI*2;
  const l=new THREE.Mesh(new THREE.SphereGeometry(.22,12,10),M(0xffd27a,{emissive:0xffb84a,emissiveIntensity:.6}));
  l.position.set(Math.cos(a)*6.4,2.6+Math.sin(i*2)*.15,Math.sin(a)*6.4);scene.add(l);
}
// central sculpture
const sc=new THREE.Mesh(new THREE.TorusKnotGeometry(.7,.2,80,10),M(0xc9514a));
sc.position.set(0,1.6,-9);sc.castShadow=true;scene.add(sc);
const pl=new THREE.Mesh(new THREE.CylinderGeometry(.6,.8,.5,24),M(0x1d2433));pl.position.set(0,.25,-9);scene.add(pl);
// floor logo

  if(target&&!(meRec.fx.freeze>0)){
    const dx=target.x-me.position.x,dz=target.z-me.position.z,d=Math.hypot(dx,dz);
    if(d<.1){target=null;marker.visible=false}
    else{
      const s=Math.min(4.2*dt,d);
      me.position.x+=dx/d*s;me.position.z+=dz/d*s;walking=true;
      let a=Math.atan2(dx,dz),da=a-me.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));me.rotation.y+=da*Math.min(1,dt*10);
    }
  }
  solids.forEach(s=>{const dx=me.position.x-s.x,dz=me.position.z-s.z,d=Math.hypot(dx,dz);if(d<s.r){me.position.x=s.x+dx/d*s.r;me.position.z=s.z+dz/d*s.r}});
  const pr=Math.hypot(me.position.x,me.position.z);if(pr>31){me.position.x*=31/pr;me.position.z*=31/pr}
  me.position.y+=vy*dt;vy-=18*dt;if(me.position.y<=0){me.position.y=0;vy=0}
  fxUpdate(meRec,dt,T);
  // pose
  body.rotation.set(0,0,0);body.position.y=.55;armL.position.set(-.36,.4,0);armR.position.set(.36,.4,0);
  const sw=walking?Math.sin(T*10):0;
  legL.rotation.x=sw*.6;legR.rotation.x=-sw*.6;
  if(walking)body.position.y=.55+Math.abs(sw)*.05;
  if(act){
    act.t+=dt;const t=act.t;
    if(act.n==='play'){armL.position.set(-.2,.55,.3);armR.position.set(.2,.5+Math.sin(t*8)*.08,.3);if(t>1.4)act=null}
    else if(act.n==='act'){const p=Math.min(t/1.6,1);body.rotation.x=Math.sin(p*Math.PI)*.75;armL.position.set(-.45,.45+Math.sin(p*Math.PI)*.3,.1);armR.position.set(.45,.45+Math.sin(p*Math.PI)*.3,.1);if(t>1.6)act=null}
    else if(act.n==='dance'){me.rotation.y+=dt*8;body.position.y=.55+Math.abs(Math.sin(t*7))*.25;armL.position.y=armR.position.y=.8+Math.sin(t*10)*.1;if(t>1.8)act=null}
    else if(act.n==='shoot'){armL.position.set(-.18,.75,.3);armR.position.set(.18,.75,.3);if(t>.8)act=null}
  }
  if(castT>0){castT-=dt;armR.position.set(.3,.72,.35)}
  if(sel){ring.position.set(sel.g.position.x,.04,sel.g.position.z);ring.scale.setScalar(1+Math.sin(T*5)*.08)}
  if(beamT>0&&beamTgt){beamT-=dt;tip.getWorldPosition(bv);const gp=beamTgt.g.position,bp=beam.geometry.attributes.position;bp.setXYZ(0,bv.x,bv.y,bv.z);bp.setXYZ(1,gp.x,gp.y+1,gp.z);bp.needsUpdate=true;beam.material.opacity=Math.max(0,beamT/.45);beam.visible=beamT>0}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t+=dt;s.v.y-=9*dt;s.m.position.addScaledVector(s.v,dt);s.m.material.opacity=Math.max(0,1-s.t/.8);if(s.t>.8){scene.remove(s.m);s.m.material.dispose();sparks.splice(i,1)}}
  sc.rotation.y=T*.4;sc.rotation.x=T*.2;
  marker.scale.setScalar(1+Math.sin(T*5)*.1);
  // camera follow
  const f=new THREE.Vector3(me.position.x,1,me.position.z).sub(oc.target).multiplyScalar(Math.min(1,dt*4));
  oc.target.add(f);cam.position.add(f);
  oc.update();
  // zone
  const near=solids.find(s=>s.name&&Math.hypot(me.position.x-s.x,me.position.z-s.z)<s.r+2.2);
  const nm=near?near.name:'';
  if(nm!==zoneName){zoneName=nm;const z=$('#zone');z.textContent=nm?`${nm} 앞`:'';z.style.opacity=nm?1:0}
  sorryT-=dt;sorryCd-=dt;
  updateFriends(dt,T);
  tags.forEach(t=>place(t,t.pos));
  place(myTag,new THREE.Vector3(me.position.x,me.position.y+th(meRec),me.position.z));
  if(sorryT>0)place(sorry,new THREE.Vector3(me.position.x,me.position.y+th(meRec)+.7,me.position.z));else sorry.e.style.display='none';
  sayT-=dt;if(sayT>0)place(say,new THREE.Vector3(me.position.x,me.position.y+th(meRec)+(sorryT>0?1.5:.7),me.position.z));else say.e.style.display='none';
  for(let i=floaters.length-1;i>=0;i--){const q=floaters[i];q.t+=dt;q.p.y+=dt*.8;place(q,q.p);q.e.style.opacity=1-q.t/1.2;if(q.t>1.2){q.e.remove();floaters.splice(i,1)}}
  R.render(scene,cam);
  requestAnimationFrame(loop);
}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
loop();
</script>
</body>
</html>
